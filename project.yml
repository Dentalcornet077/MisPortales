name: MisPortales
options:
  bundleIdPrefix: com.misportales
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    PRODUCT_BUNDLE_IDENTIFIER: com.misportales.app
    # Sin firma: el .ipa se instala con TrollStore
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  MisPortales:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ECPC Drive
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Se usa para desbloquear tus contraseñas guardadas."
        NSCameraUsageDescription: "Algunos portales pueden pedir la cámara para subir fotos o documentos."
        NSMicrophoneUsageDescription: "Algunos portales pueden pedir el micrófono."
        NSPhotoLibraryUsageDescription: "Para adjuntar imágenes desde tus fotos en los portales."
        ITSAppUsesNonExemptEncryption: false
